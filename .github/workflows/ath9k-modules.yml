name: сборка ядра [AOSP] # build kernel [AOSP]

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Извлечение кода # Checkout Code
        uses: actions/checkout@v4

      - name: Подготовка часового пояса # Prepare timezone
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date "+%d%m%Y-%H%M")" >> $GITHUB_ENV
          sudo rm /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

      - name: Установка зависимостей # Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install bc cpio flex bison aptitude git python-is-python3 tar perl wget curl lz4 -y
          sudo aptitude install libssl-dev -y

      - name: Получение наборов инструментов # Fetch Toolchains
        run: |
          mkdir clang && curl https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -RLO && tar -C clang/ -xf clang-*.tar.gz
          git clone https://github.com/greenforce-project/gcc-arm64 -b main --depth=1 gcc64
          git clone https://github.com/greenforce-project/gcc-arm -b main --depth=1 gcc32

      - name: Получение KernelSU-SuSFS # Fetch KernelSU-SuSFS
        # Эта команда загружает исходный код ядра в каталог 'kernel/'
        run: |
          curl -LSs "https://raw.githubusercontent.com/buildkernel1/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs

      - name: Размеры AOSP # AOSP Dimensi
        # Предполагается, что исходный код ядра находится в каталоге 'kernel/'
        run: |
          sed -i 's/qcom,mdss-pan-physical-width-dimension = <695>;$/qcom,mdss-pan-physical-width-dimension = <69>;/' kernel/arch/arm64/boot/dts/qcom/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi
          sed -i 's/qcom,mdss-pan-physical-height-dimension = <1546>;$/qcom,mdss-pan-physical-height-dimension = <154>;/' kernel/arch/arm64/boot/dts/qcom/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi

      - name: Патч defconfig ядра для ath9k_htc # Patch kernel defconfig for ath9k_htc
        # Путь к defconfig относительно корня исходного кода ядра
        run: |
          echo 'CONFIG_CFG80211=m' >> kernel/arch/arm64/configs/vendor/sweet_defconfig
          echo 'CONFIG_MAC80211=m' >> kernel/arch/arm64/configs/vendor/sweet_defconfig
          echo 'CONFIG_ATH_COMMON=m' >> kernel/arch/arm64/configs/vendor/sweet_defconfig
          echo 'CONFIG_ATH9K_HW=m' >> kernel/arch/arm64/configs/vendor/sweet_defconfig
          echo 'CONFIG_ATH9K_COMMON=m' >> kernel/arch/arm64/configs/vendor/sweet_defconfig
          echo 'CONFIG_ATH9K_HTC=m' >> kernel/arch/arm64/configs/vendor/sweet_defconfig
          echo 'CONFIG_USB_ATH9K_HTC=m' >> kernel/arch/arm64/configs/vendor/sweet_defconfig
          echo 'CONFIG_WLAN_VENDOR_ATH=y' >> kernel/arch/arm64/configs/vendor/sweet_defconfig

      - name: Сборка ядра # Build Kernel
        run: |
          export ARCH=arm64
          export PATH="${PWD}/clang/bin:${PWD}/gcc64/bin:${PWD}/gcc32/bin:${PATH}"
          export KBUILD_BUILD_USER=buildkernel1
          export KBUILD_BUILD_HOST=mhddonip
          export KBUILD_COMPILER_STRING="${PWD}/clang"
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          # Используйте -C kernel для запуска make из каталога исходного кода ядра
          make -C kernel O=out vendor/sweet_defconfig
          make -C kernel -j$(nproc --all) O=out CC=clang
          # Файл .config будет находиться в kernel/out/
          mv kernel/out/.config kernel/out/sweet_defconfig.txt

      - name: Загрузка defconfig # Upload defconfig
        uses: actions/upload-artifact@v4
        with:
          name: defconfig-${{ env.BUILD_TIME }}
          # Путь к файлу defconfig после сборки
          path: kernel/out/sweet_defconfig.txt

      - name: Получение AnyKernel3 # Fetch AnyKernel3
        run: |
          git clone --depth=1 https://github.com/buildkernel1/Anykernel3.git -b main AnyKernel3
          # Копирование артефактов из kernel/out/
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          fi
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi
          if [ -f kernel/out/arch/arm64/boot/dtb.img ]; then
            cp kernel/out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img
          fi

      - name: Загрузка ядра # Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: STRIX-Interstellar-AOSP-${{ env.BUILD_TIME }}
          path: AnyKernel3/* # Это загрузит содержимое AnyKernel3

      - name: Сборка модулей ядра # Build kernel modules
        # Правильный отступ и -C kernel для команды make
        run: |
          export ARCH=arm64
          export PATH="${PWD}/clang/bin:${PWD}/gcc64/bin:${PWD}/gcc32/bin:${PATH}"
          export CROSS_COMPILE=aarch64-linux-android-
          export LLVM=1
          make -C kernel -j$(nproc) O=out modules

      - name: Сбор и загрузка модулей ath9k # Collect and Upload ath9k modules
        # Правильный отступ
        run: |
          mkdir -p out/modules
          # Копирование из kernel/out/
          find kernel/out -name "ath9k_htc.ko" -exec cp {} out/modules/ \;
          find kernel/out -name "mac80211.ko" -exec cp {} out/modules/ \;
          find kernel/out -name "cfg80211.ko" -exec cp {} out/modules/ \;

      - name: Загрузка модулей ath9k # Upload ath9k modules
        # Изменено на v4 для согласованности
        uses: actions/upload-artifact@v4
        with:
          name: ath9k-modules
          path: out/modules/
